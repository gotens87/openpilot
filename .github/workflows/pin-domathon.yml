name: Pin Domathon

# Pins branch Domathon to an exact commit from upstream SecretGoodStarPilot, PLUS
# the "domathon" patcher set from ops_patches/, verified by the opendbc Toyota
# tests before anything is pushed. Committer date is pinned to the picked commit's,
# so the result is a deterministic function of the input sha and a rollback is
# just a re-run with an older sha. workflow_dispatch only -- a pinned branch must
# not move on a schedule.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-hex commit on upstream SecretGoodStarPilot to pin Domathon to'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pin-domathon
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/firestar5683/StarPilot.git
  UPSTREAM_BRANCH: SecretGoodStarPilot
  TARGET_BRANCH: Domathon

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if ! printf '%s\n' "$INPUT_SHA" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::sha must be a full 40-character lowercase hex commit, got '$INPUT_SHA'"
            exit 1
          fi
          echo "PIN_SHA=$INPUT_SHA" >> "$GITHUB_ENV"

      - name: Check sha is on SecretGoodStarPilot
        env:
          GH_TOKEN: ${{ secrets.PATCHQUEUE_TOKEN }}
        run: |
          # The compare API answers the ancestry question without cloning a ~6k-file
          # repo: base=branch, head=sha, so behind/identical means the sha is an
          # ancestor-or-equal of the SecretGoodStarPilot tip. ahead/diverged means it
          # belongs to some other branch; an unknown sha 404s and fails the step.
          upstream=${UPSTREAM_REPO#https://github.com/}
          status=$(gh api "repos/${upstream%.git}/compare/${UPSTREAM_BRANCH}...${PIN_SHA}" --jq .status)
          echo "compare $UPSTREAM_BRANCH...$PIN_SHA: $status"
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$PIN_SHA is not reachable from $UPSTREAM_BRANCH (compare: $status) - refusing to pin"
            exit 1
          fi

      - name: Check out ops branch for patchers
        uses: actions/checkout@v4
        with:
          path: ops

      - name: Fetch pinned sha
        run: |
          git init -q work
          cd work
          git remote add upstream "$UPSTREAM_REPO"
          git fetch -q --depth=1 --no-tags upstream "$PIN_SHA"
          # Pin the committer date to the picked commit's, same as rebuild-starpilot.yml
          # does with Dom's, so an unchanged re-run is bit-identical and the
          # force-push below becomes a no-op.
          echo "PIN_DATE=$(git log -1 --format=%cI FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Apply domathon patch series
        env:
          GIT_AUTHOR_NAME: gotens87
          GIT_AUTHOR_EMAIL: gotens87@users.noreply.github.com
          GIT_COMMITTER_NAME: gotens87
          GIT_COMMITTER_EMAIL: gotens87@users.noreply.github.com
        run: |
          cd work
          export GIT_COMMITTER_DATE="$PIN_DATE"
          git checkout -q -B "$TARGET_BRANCH" "$PIN_SHA"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Fail-closed, same spirit as rebuild-starpilot.yml: a missing or ambiguous
          # anchor exits non-zero here, the job stops before the tests and the push,
          # and Domathon stays at last-good. No patch is ever skipped or auto-resolved.
          if ! PATCHER_SET=domathon ../ops/tools/apply-patchers.sh "$PWD" ../ops/ops_patches; then
            echo "::error::patcher failed - upstream restructured a patched file; anchors need updating in ops_patches/"
            exit 1
          fi

          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run opendbc Toyota tests
        env:
          # Tests run from work/opendbc_repo, but the openpilot python package lives
          # at the work/ root; without this, test_tx_hook_on_wrong_safety_mode dies
          # on ModuleNotFoundError: No module named openpilot.
          PYTHONPATH: ${{ github.workspace }}/work
        run: |
          cd work/opendbc_repo
          pip install numpy tqdm pycapnp pycryptodome pytest hypothesis parameterized cffi
          # Steps run with bash -eo pipefail: any red test fails the job here, so the
          # push step never runs. Tests gate the push, they don't just report.
          python -m pytest -q opendbc/car/toyota/tests opendbc/safety/tests/test_toyota.py
          python -m pytest -q opendbc/car/tests/test_car_interfaces.py -k "TOYOTA or LEXUS"

      - name: Push if changed
        env:
          PATCHQUEUE_TOKEN: ${{ secrets.PATCHQUEUE_TOKEN }}
        run: |
          cd work
          # PAT, not GITHUB_TOKEN: the pushed tree contains .github/workflows, which
          # GITHUB_TOKEN is not permitted to push.
          remote="https://x-access-token:${PATCHQUEUE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          current=$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | cut -f1)

          if [ "$current" = "$NEW_SHA" ]; then
            echo "$TARGET_BRANCH already at $NEW_SHA - nothing to do"
            exit 0
          fi

          # --force because pinning an older sha (rollback) is a non-fast-forward.
          git push -q --force "$remote" "HEAD:refs/heads/$TARGET_BRANCH"
          echo "pinned $TARGET_BRANCH: ${current:-none} -> $NEW_SHA"

# ponytail: no job-summary step. The pinned sha, test outcome, and pushed-or-not
# are in the step logs, which is where you look when it breaks.
