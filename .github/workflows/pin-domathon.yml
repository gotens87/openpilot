name: Pin Domathon

# Builds branch Domathon as: a pinned commit from upstream Dom (7.0 testing),
# PLUS the "domathon" patcher set from ops_patches/, verified by the opendbc
# Toyota tests before anything is pushed. Committer date is pinned to the picked
# commit's, so the result is a deterministic function of the picked sha and a
# rollback is just a re-run with an older sha.
#
# Scheduled runs (blank sha) follow the Dom tip, skipping the
# build when Domathon is already built on it. A manual dispatch with an explicit
# sha pins or rolls back; to keep a rollback from being undone 10 minutes later,
# set repo variable DOMATHON_HOLD (any non-empty value parks the schedule),
# dispatch the pin, then clear the variable to resume following.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-hex commit on upstream Dom to pin Domathon to; blank = current Dom tip'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pin-domathon
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/firestar5683/StarPilot.git
  UPSTREAM_BRANCH: Dom
  TARGET_BRANCH: Domathon

jobs:
  pin:
    runs-on: ubuntu-latest
    # Scheduled runs park while repo variable DOMATHON_HOLD is non-empty, so a
    # manual rollback pin is not undone 10 minutes later. Dispatch always runs.
    if: github.event_name != 'schedule' || vars.DOMATHON_HOLD == ''
    steps:
      - name: Check out ops branch for patchers
        uses: actions/checkout@v4
        with:
          path: ops

      - name: Resolve pin sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            if ! printf '%s\n' "$INPUT_SHA" | grep -qxE '[0-9a-f]{40}'; then
              echo "::error::sha must be a full 40-character lowercase hex commit, got '$INPUT_SHA'"
              exit 1
            fi
            pin="$INPUT_SHA"
          else
            # Blank input (always the case on schedule): follow the upstream tip.
            pin=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
            if [ -z "$pin" ]; then
              echo "::error::could not resolve $UPSTREAM_BRANCH tip on $UPSTREAM_REPO"
              exit 1
            fi
          fi
          echo "PIN_SHA=$pin" >> "$GITHUB_ENV"
          echo "pinning $TARGET_BRANCH to $pin ($GITHUB_EVENT_NAME)"

      - name: Check sha is on upstream branch
        env:
          GH_TOKEN: ${{ secrets.PATCHQUEUE_TOKEN }}
        run: |
          # The compare API answers the ancestry question without cloning a ~6k-file
          # repo: base=branch, head=sha, so behind/identical means the sha is an
          # ancestor-or-equal of the upstream tip. ahead/diverged means it
          # belongs to some other branch; an unknown sha 404s and fails the step.
          upstream=${UPSTREAM_REPO#https://github.com/}
          status=$(gh api "repos/${upstream%.git}/compare/${UPSTREAM_BRANCH}...${PIN_SHA}" --jq .status)
          echo "compare $UPSTREAM_BRANCH...$PIN_SHA: $status"
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$PIN_SHA is not reachable from $UPSTREAM_BRANCH (compare: $status) - refusing to pin"
            exit 1
          fi

      - name: Check whether upstream moved
        env:
          GH_TOKEN: ${{ secrets.PATCHQUEUE_TOKEN }}
        run: |
          # A patchless force-push would silently ship unpatched code to the car.
          count=$(PATCHER_SET=domathon ops/tools/apply-patchers.sh --count)
          if [ "${count:-0}" -eq 0 ] || [ ! -d ops/ops_patches ]; then
            echo "::error::no domathon patchers found in ops/ops_patches/ - refusing to build"
            exit 1
          fi
          echo "PATCH_COUNT=$count" >> "$GITHUB_ENV"

          # Our tip is the pinned sha + N patch commits, so entry N is the base we
          # last built on.
          base=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$TARGET_BRANCH&per_page=$((count + 1))" \
                   --jq ".[$count].sha" 2>/dev/null || true)
          [ "$base" = "null" ] && base=""

          # Only scheduled runs may skip on an unchanged tip. A manual dispatch
          # always builds: explicit sha is a pin/rollback (the push step no-ops if
          # the result is identical), blank sha is the force path after editing
          # ops_patches/.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -n "$base" ] && [ "$base" = "$PIN_SHA" ]; then
            echo "UPSTREAM_MOVED=no" >> "$GITHUB_ENV"
            echo "$TARGET_BRANCH already built on $PIN_SHA, nothing to do"
          else
            echo "UPSTREAM_MOVED=yes" >> "$GITHUB_ENV"
            echo "build needed: pin $PIN_SHA, last built on ${base:-unknown} ($GITHUB_EVENT_NAME)"
          fi

      - name: Fetch pinned sha
        if: env.UPSTREAM_MOVED == 'yes'
        run: |
          git init -q work
          cd work
          git remote add upstream "$UPSTREAM_REPO"
          git fetch -q --depth=1 --no-tags upstream "$PIN_SHA"
          # Pin the committer date to the picked commit's, same as rebuild-starpilot.yml
          # does with Dom's, so an unchanged re-run is bit-identical and the
          # force-push below becomes a no-op.
          echo "PIN_DATE=$(git log -1 --format=%cI FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Apply domathon patch series
        if: env.UPSTREAM_MOVED == 'yes'
        env:
          GIT_AUTHOR_NAME: gotens87
          GIT_AUTHOR_EMAIL: gotens87@users.noreply.github.com
          GIT_COMMITTER_NAME: gotens87
          GIT_COMMITTER_EMAIL: gotens87@users.noreply.github.com
        run: |
          cd work
          export GIT_COMMITTER_DATE="$PIN_DATE"
          git checkout -q -B "$TARGET_BRANCH" "$PIN_SHA"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Fail-closed, same spirit as rebuild-starpilot.yml: a missing or ambiguous
          # anchor exits non-zero here, the job stops before the tests and the push,
          # and Domathon stays at last-good. No patch is ever skipped or auto-resolved.
          if ! PATCHER_SET=domathon ../ops/tools/apply-patchers.sh "$PWD" ../ops/ops_patches; then
            echo "::error::patcher failed - upstream restructured a patched file; anchors need updating in ops_patches/"
            exit 1
          fi

          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        if: env.UPSTREAM_MOVED == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run opendbc Toyota tests
        if: env.UPSTREAM_MOVED == 'yes'
        run: |
          cd work/opendbc_repo
          pip install numpy tqdm pycapnp pycryptodome pytest hypothesis parameterized cffi
          # Steps run with bash -eo pipefail: any red test fails the job here, so the
          # push step never runs. Tests gate the push, they don't just report.
          # -k skips tests that import the full openpilot tree at test runtime
          # (setproctitle, starpilot.car.toyota.tests, etc.) but cover none of
          # the safety C / Camry patchers, so they're deselected rather than
          # chasing deps: test_tx_hook_on_wrong_safety_mode,
          # test_lta_and_lka_must_both_be_healthy, test_matrix_stock_aol_admission.
          # --ignore skips tests that import the full openpilot tree at module
          # scope (collection fails; -k can't filter). They don't cover our Camry patchers.
          python -m pytest -q opendbc/car/toyota/tests opendbc/safety/tests/test_toyota.py -k "not test_tx_hook_on_wrong_safety_mode and not test_lta_and_lka_must_both_be_healthy and not test_matrix_stock_aol_admission" --ignore=opendbc/car/toyota/tests/test_prius_inactive.py --ignore=opendbc/car/toyota/tests/test_rav4h_filter.py --ignore=opendbc/car/toyota/tests/test_lexus_is.py
          python -m pytest -q opendbc/car/tests/test_car_interfaces.py -k "TOYOTA or LEXUS"

      - name: Push if changed
        if: env.UPSTREAM_MOVED == 'yes'
        env:
          PATCHQUEUE_TOKEN: ${{ secrets.PATCHQUEUE_TOKEN }}
        run: |
          cd work
          # PAT, not GITHUB_TOKEN: the pushed tree contains .github/workflows, which
          # GITHUB_TOKEN is not permitted to push.
          remote="https://x-access-token:${PATCHQUEUE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          current=$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | cut -f1)

          if [ "$current" = "$NEW_SHA" ]; then
            echo "$TARGET_BRANCH already at $NEW_SHA - nothing to do"
            exit 0
          fi

          # --force because pinning an older sha (rollback) is a non-fast-forward.
          git push -q --force "$remote" "HEAD:refs/heads/$TARGET_BRANCH"
          echo "pinned $TARGET_BRANCH: ${current:-none} -> $NEW_SHA"

# ponytail: no job-summary step. The pinned sha, moved-check, test outcome, and
# pushed-or-not are in the step logs, which is where you look when it breaks.
